apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev
resources:
  - ../../base
  - namespace.yaml
patches:
  - path: deployment-patch.yaml
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: hello-world
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: dev.example.com
images:
  - name: ghcr.io/q-chakorn/coraline-challenge-pretest/hello-world
    digest: sha256:a1b1384692f55e9fd2467f09566e76c7df2ee5815d4ca20748824b4887d3e708
