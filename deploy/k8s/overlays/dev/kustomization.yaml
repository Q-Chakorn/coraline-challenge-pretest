apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev
resources:
  - ../../base
  - namespace.yaml
patches:
  - path: deployment-patch.yaml
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: hello-world
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: dev.example.com
images:
  - name: ghcr.io/q-chakorn/coraline-challenge-pretest/hello-world
    digest: sha256:57f88d4a90d2bec65f292ad4929ad01938c8bdcbc66dd4c189dc5563fbaaadb7
