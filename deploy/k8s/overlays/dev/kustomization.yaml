apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev
resources:
  - ../../base
  - namespace.yaml
patches:
  - path: deployment-patch.yaml
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: hello-world
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: dev.example.com
images:
  - name: ghcr.io/q-chakorn/coraline-challenge-pretest/hello-world
    digest: sha256:9d55f75120ad964e915a06f66071118bd01830a497126b8e3c79760609760222
