apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev
resources:
  - ../../base
  - namespace.yaml
patches:
  - path: deployment-patch.yaml
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: hello-world
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: dev.example.com
images:
  - name: ghcr.io/q-chakorn/coraline-challenge-pretest/hello-world
    digest: sha256:46a720a51a69c6eaa560e195f5cf8e641db0c7e7ed0dc80826445adc635cc5da
