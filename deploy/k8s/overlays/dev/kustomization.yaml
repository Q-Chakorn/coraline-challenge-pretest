apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev
resources:
  - ../../base
  - namespace.yaml
patches:
  - path: deployment-patch.yaml
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: hello-world
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: dev.example.com
images:
  - name: ghcr.io/q-chakorn/coraline-challenge-pretest/hello-world
    digest: sha256:a892233dba277a358507e657333d19612c4c165e821399d2ce79ee918812f6b5
