name: HELLO CI

on:
  push:
    branches:
      - master
    paths:
      - "go-hello-world/**"
      - ".github/workflows/action-ci.yaml"
  pull_request:
    paths:
      - "go-hello-world/**"
      - ".github/workflows/action-ci.yaml"

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build application
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-hello-world
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go-hello-world/go.mod
          cache-dependency-path: go-hello-world/go.mod
      
      - name: Check formatting
        run: go fmt ./...
      - name: test
        run: go test ./...

      - name: Build Go application
        run: go build ./...

  build-and-push-image:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      
      - name: setup docker
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./go-hello-world
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/q-chakorn/coraline-challenge-pretest/hello-world:${{ github.sha }}

      - name: Publish image digest in the run summary
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Built image: ghcr.io/q-chakorn/coraline-challenge-pretest/hello-world@${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo "Use this digest as the image_digest input to promote-image for staging, then prod." >> "$GITHUB_STEP_SUMMARY"

  update-dev-image:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out GitOps repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Update dev overlay to the newly built image digest
        env:
          IMAGE_DIGEST: ${{ needs.build-and-push-image.outputs.image_digest }}
        run: |
          if ! [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid image digest: $IMAGE_DIGEST" >&2
            exit 1
          fi
          overlay="deploy/k8s/overlays/dev/kustomization.yaml"
          sed -i -E "s|^    (newTag|digest): .*|    digest: ${IMAGE_DIGEST}|" "$overlay"

      - name: Commit dev image update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/k8s/overlays/dev/kustomization.yaml
          if git diff --cached --quiet; then
            echo "dev already points to this image"
            exit 0
          fi
          git commit -m "chore(gitops): deploy ${GITHUB_SHA} to dev"
          git push
