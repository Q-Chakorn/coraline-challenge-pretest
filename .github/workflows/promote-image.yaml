name: Promote image

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to promote into
        required: true
        type: choice
        options:
          - staging
          - prod
      image_digest:
        description: Image digest from CI, with or without the sha256 prefix
        required: true
        type: string

permissions:
  contents: read

jobs:
  promote:
    name: Promote image to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: write
    steps:
      - name: Check out GitOps repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Update target environment overlay
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          if [[ "$IMAGE_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            IMAGE_DIGEST="sha256:${IMAGE_DIGEST}"
          fi
          if ! [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid image digest: $IMAGE_DIGEST" >&2
            exit 1
          fi

          case "$TARGET_ENVIRONMENT" in
            staging) previous_environment=dev ;;
            prod) previous_environment=staging ;;
            *) echo "Unsupported target environment: $TARGET_ENVIRONMENT" >&2; exit 1 ;;
          esac

          previous_overlay="deploy/k8s/overlays/${previous_environment}/kustomization.yaml"
          if ! grep -Fqx "    digest: ${IMAGE_DIGEST}" "$previous_overlay"; then
            echo "${previous_environment} must already use ${IMAGE_DIGEST} before promotion" >&2
            exit 1
          fi

          overlay="deploy/k8s/overlays/${TARGET_ENVIRONMENT}/kustomization.yaml"
          awk -v digest="$IMAGE_DIGEST" '
            /^    (newTag|digest): / { print "    digest: " digest; count++; next }
            { print }
            END { if (count != 1) exit 1 }
          ' "$overlay" > "$overlay.tmp"
          mv "$overlay.tmp" "$overlay"

      - name: Commit promotion
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "deploy/k8s/overlays/${TARGET_ENVIRONMENT}/kustomization.yaml"
          if git diff --cached --quiet; then
            echo "${TARGET_ENVIRONMENT} already points to this image"
            exit 0
          fi
          git commit -m "chore(gitops): promote image to ${TARGET_ENVIRONMENT}"
          git push
